          {conf&&<Btn onClick={()=>{if(!st.retake.includes(qi))st.retake.push(qi);refresh();}} variant="warn">📌 Refazer</Btn>}
          {conf&&<Btn onClick={()=>{if(st.idx<list.length-1){st.idx++;refresh();}}} variant="primary">Próxima ▶</Btn>}
          {st.retake.length>0&&<Btn onClick={()=>{st.retake.forEach(i=>{st.confirmed[i]=false;st.inputs[i]="";});st.idx=0;refresh();}} variant="danger">↺ Refazer ({st.retake.length})</Btn>}
        </div>
      </div>);
    }

    function TelaVF({refresh}){
      const st=vf_state;
      const list=st.wrong.length>0&&st.mode==="wrong"?st.wrong:Array.from({length:VF_QS.length},(_,i)=>i);
      const qi=list[st.idx]??0; const q=VF_QS[qi]; const conf=st.confirmed[qi];
      function choose(v){if(conf)return;st.chosen[qi]=v;refresh();}
      function confirm(){if(st.chosen[qi]===null)return;st.confirmed[qi]=true;if(st.chosen[qi]!==q.ans&&!st.wrong.includes(qi))st.wrong.push(qi);refresh();}
      const acertou=conf&&st.chosen[qi]===q.ans;
      return(<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
          <h2 style={{color:"#1a8cff",margin:0}}>🔵 Verdadeiro ou Falso</h2>
          <button onClick={()=>{vf_state={idx:0,chosen:Array(VF_QS.length).fill(null),confirmed:Array(VF_QS.length).fill(false),wrong:[],mode:"all"};refresh();}} style={{background:"#2d3e52",color:"#8ca0b8",border:"none",borderRadius:"5px",padding:"4px 10px",cursor:"pointer",fontSize:"12px"}}>↺ Reiniciar</button>
        </div>
        <Progresso atual={st.idx+1} total={list.length}/>
        <Card>
          <p style={{color:"#c8d8e8",lineHeight:1.7}}><strong style={{color:"#8ca0b8"}}>Q{st.idx+1}.</strong> {q.q}</p>
          <div style={{display:"flex",gap:"10px",marginTop:"12px"}}>
            {[true,false].map(v=>(<div key={String(v)} onClick={()=>choose(v)} style={{flex:1,padding:"12px",textAlign:"center",borderRadius:"8px",cursor:conf?"default":"pointer",background:conf?(v===q.ans?"#003300":(v===st.chosen[qi]?"#330000":"#1e2a3a")):(st.chosen[qi]===v?"#1a3a5c":"#1e2a3a"),border:conf?(v===q.ans?"2px solid #00c97f":(v===st.chosen[qi]?"2px solid #ff5252":"2px solid #2d3e52")):(st.chosen[qi]===v?"2px solid #1a8cff":"2px solid #2d3e52"),color:"#fff",fontSize:"16px",fontWeight:"bold"}}>{v?"✅ V":"❌ F"}</div>))}
          </div>
          {conf&&<div style={{marginTop:"12px",background:acertou?"#0a2a1a":"#2a0a0a",borderRadius:"8px",padding:"12px",border:`1px solid ${acertou?"#00c97f":"#ff5252"}`}}><p style={{color:acertou?"#00c97f":"#ff5252",margin:0}}>{acertou?"✅ CORRETO!":"❌ ERRADO — Resposta: "+(q.ans?"VERDADEIRO":"FALSO")}</p><p style={{color:"#ffaa00",fontSize:"13px",marginTop:"8px"}}>💡 {q.mem}</p></div>}
          {!conf&&<p style={{color:"#8ca0b8",fontSize:"12px",marginTop:"10px"}}>💡 {q.hint}</p>}
        </Card>
        <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
          <Btn onClick={()=>{if(st.idx>0){st.idx--;refresh();}}} variant="ghost">◀ Anterior</Btn>
          {!conf&&<Btn onClick={confirm} variant="success">✓ Confirmar</Btn>}
          {conf&&<Btn onClick={()=>{if(st.idx<list.length-1){st.idx++;refresh();}}} variant="primary">Próxima ▶</Btn>}
          {st.wrong.length>0&&<Btn onClick={()=>{st.wrong.forEach(i=>{st.confirmed[i]=false;st.chosen[i]=null;});vf_state.mode="wrong";st.idx=0;refresh();}} variant="warn">↺ Refazer Erradas ({st.wrong.length})</Btn>}
        </div>
      </div>);
    }

    function TelaFlashcards({refresh}){
      const [virado,setVirado]=useState(false);
      const [startInput,setStartInput]=useState(String(fc_state.startIdx+1));
      const st=fc_state;
      const list=st.modo==="naosabido"?st.naosabidos:Array.from({length:FLASHCARDS.length},(_,i)=>i);
      const qi=list[st.idx]??0; const card=FLASHCARDS[qi];
      return(<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
          <h2 style={{color:"#ffaa00",margin:0}}>🃏 Flashcards</h2>
          <button onClick={()=>{fc_state={idx:0,startIdx:0,sabidos:[],naosabidos:[],modo:"all"};setVirado(false);setStartInput("1");refresh();}} style={{background:"#2d3e52",color:"#8ca0b8",border:"none",borderRadius:"5px",padding:"4px 10px",cursor:"pointer",fontSize:"12px"}}>↺ Reiniciar</button>
        </div>
        <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"12px"}}>
          <span style={{color:"#8ca0b8",fontSize:"13px"}}>Iniciar do card:</span>
          <input type="number" value={startInput} onChange={e=>setStartInput(e.target.value)} min="1" max={FLASHCARDS.length} style={{width:"60px",padding:"4px",background:"#1e2a3a",color:"#fff",border:"1px solid #2d3e52",borderRadius:"5px",fontSize:"13px"}}/>
          <Btn onClick={()=>{const n=parseInt(startInput)-1;if(n>=0&&n<FLASHCARDS.length){st.idx=n;st.startIdx=n;setVirado(false);refresh();}}} variant="ghost">Ir</Btn>
        </div>
        <Progresso atual={st.idx+1} total={list.length}/>
        <div onClick={()=>setVirado(v=>!v)} style={{cursor:"pointer",minHeight:"200px",background:"#14203a",border:"2px solid #ffaa00",borderRadius:"12px",padding:"24px",marginBottom:"14px",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center"}}>
          {!virado?(<div><p style={{color:"#8ca0b8",fontSize:"12px",marginBottom:"10px"}}>FRENTE — clique para virar</p><p style={{color:"#ffaa00",fontSize:"15px",fontWeight:"bold",lineHeight:1.6}}>{card.frente}</p><p style={{color:"#8ca0b8",fontSize:"12px",marginTop:"12px"}}>💡 {card.hint}</p></div>):(<div><p style={{color:"#8ca0b8",fontSize:"12px",marginBottom:"10px"}}>VERSO — resposta</p><pre style={{color:"#c8d8e8",fontSize:"13px",lineHeight:1.7,whiteSpace:"pre-wrap",textAlign:"left",margin:0}}>{card.verso}</pre><div style={{background:"#1a2a3a",borderRadius:"8px",padding:"10px",marginTop:"12px",border:"1px solid #ffaa00"}}><p style={{color:"#ffaa00",fontSize:"12px",margin:0}}>🧠 {card.mem}</p></div></div>)}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"6px",justifyContent:"center"}}>
          <Btn onClick={()=>{if(st.idx>0){st.idx--;setVirado(false);refresh();}}} variant="ghost">◀ Anterior</Btn>
          <Btn onClick={()=>setVirado(v=>!v)} variant="warn">{virado?"← Frente":"Virar →"}</Btn>
          {virado&&<Btn onClick={()=>{if(!st.sabidos.includes(qi))st.sabidos.push(qi);setVirado(false);if(st.idx<list.length-1){st.idx++;refresh();}}} variant="success">✅ Sabia</Btn>}
          {virado&&<Btn onClick={()=>{if(!st.naosabidos.includes(qi))st.naosabidos.push(qi);setVirado(false);if(st.idx<list.length-1){st.idx++;refresh();}}} variant="danger">❌ Não Sabia</Btn>}
          {st.naosabidos.length>0&&<Btn onClick={()=>{st.modo="naosabido";st.idx=0;setVirado(false);refresh();}} variant="warn">👁️ Rever Não Sabia ({st.naosabidos.length})</Btn>}
        </div>
        <div style={{marginTop:"12px",display:"flex",gap:"12px",justifyContent:"center"}}>
          <span style={{color:"#00c97f",fontSize:"12px"}}>✅ Sabia: {st.sabidos.length}</span>
          <span style={{color:"#ff5252",fontSize:"12px"}}>❌ Não Sabia: {st.naosabidos.length}</span>
        </div>
      </div>);
    }

    function TelaMapaMental(){
      const [expandido,setExpandido]=useState({});
      const [detalhe,setDetalhe]=useState(null);
      return(<div>
        <h2 style={{color:"#1a8cff",marginBottom:"6px"}}>🗺️ Mapa Mental Interativo</h2>
        <p style={{color:"#8ca0b8",fontSize:"12px",marginBottom:"16px"}}>Clique nos ramos para expandir. Clique nos nós filhos para ver detalhes.</p>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"10px"}}>
          <div style={{background:"linear-gradient(135deg,#1a8cff,#004c99)",borderRadius:"50px",padding:"14px 28px",color:"#fff",fontWeight:"bold",fontSize:"16px",boxShadow:"0 4px 20px rgba(26,140,255,0.4)"}}>⚓ {MAPA_MENTAL.centro}</div>
          {MAPA_MENTAL.ramos.map((ramo,i)=>(<div key={i} style={{width:"100%",maxWidth:"600px"}}>
            <div onClick={()=>{setExpandido(e=>({...e,[i]:!e[i]}));setDetalhe(null);}} style={{background:`${ramo.cor}22`,border:`2px solid ${ramo.cor}`,borderRadius:"10px",padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",color:ramo.cor,fontWeight:"bold",fontSize:"14px"}}>
              <span>{ramo.label}</span><span>{expandido[i]?"▼":"▶"}</span>
            </div>
            {expandido[i]&&(<div style={{display:"flex",flexWrap:"wrap",gap:"8px",padding:"10px 0 0 16px"}}>
              {ramo.filhos.map((f,fi)=>(<div key={fi} onClick={()=>setDetalhe(detalhe&&detalhe.ramo===i&&detalhe.fi===fi?null:{ramo:i,fi})} style={{background:detalhe&&detalhe.ramo===i&&detalhe.fi===fi?`${ramo.cor}33`:"#1e2a3a",border:`1px solid ${ramo.cor}`,borderRadius:"8px",padding:"8px 12px",cursor:"pointer",color:ramo.cor,fontSize:"12px",fontWeight:"bold",maxWidth:"180px"}}>📌 {f.label}</div>))}
            </div>)}
            {expandido[i]&&detalhe&&detalhe.ramo===i&&(<div style={{background:"#0a1a2a",borderRadius:"8px",padding:"14px",marginTop:"8px",border:`1px solid ${ramo.cor}`,marginLeft:"16px"}}>
              <p style={{color:ramo.cor,fontWeight:"bold",margin:"0 0 6px"}}>{ramo.filhos[detalhe.fi].label}</p>
              <p style={{color:"#c8d8e8",fontSize:"13px",margin:0,lineHeight:1.6}}>{ramo.filhos[detalhe.fi].desc}</p>
            </div>)}
          </div>))}
        </div>
      </div>);
    }

    function TelaConsulta(){
      const [q,setQ]=useState(busca_query);
      const textoCompleto=RESUMO_BLOCOS.map(b=>b.titulo+"\n"+b.conteudo).join("\n\n")+"\n\n"+SUPER_RESUMO;
      const linhas=q.length>2?textoCompleto.split("\n").filter(l=>l.toLowerCase().includes(q.toLowerCase())):[];
      return(<div>
        <h2 style={{color:"#00c97f",marginBottom:"12px"}}>🔍 Consulta do Conteúdo</h2>
        <input value={q} onChange={e=>{busca_query=e.target.value;setQ(e.target.value);}} placeholder="Buscar palavra ou termo..." style={{width:"100%",padding:"12px",background:"#1e2a3a",color:"#fff",border:"1px solid #2d3e52",borderRadius:"8px",fontSize:"14px",marginBottom:"14px",boxSizing:"border-box"}}/>
        {q.length<=2&&RESUMO_BLOCOS.map((b,i)=>(<Card key={i}><p style={{color:"#1a8cff",fontWeight:"bold",marginBottom:"8px"}}>{b.titulo}</p><pre style={{color:"#c8d8e8",fontSize:"12px",whiteSpace:"pre-wrap",lineHeight:1.7,margin:0}}>{b.conteudo}</pre></Card>))}
        {q.length>2&&linhas.length===0&&<p style={{color:"#ff5252"}}>Nenhum resultado para "{q}".</p>}
        {q.length>2&&linhas.map((l,i)=>(<div key={i} style={{background:"#1e2a3a",borderRadius:"6px",padding:"10px 14px",marginBottom:"6px",border:"1px solid #2d3e52"}}><p style={{color:"#c8d8e8",fontSize:"13px",margin:0,lineHeight:1.6}} dangerouslySetInnerHTML={{__html:l.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>`<mark style="background:#ffaa0044;color:#ffaa00;border-radius:3px;padding:1px 2px">${m}</mark>`)}}/></div>))}
      </div>);
    }

    function TelaQuestoesPadrao(){
      return(<div>
        <h2 style={{color:"#ff7f50",marginBottom:"16px"}}>📄 Questões Padrão</h2>
        <p style={{color:"#8ca0b8",fontSize:"13px",marginBottom:"16px"}}>Questões originais do material enviado, sem alterações.</p>
        {QUESTOES_PADRAO.map((q,i)=>(<Card key={i}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}><span style={{color:"#ff7f50",fontWeight:"bold",fontSize:"12px"}}>{q.tipo}</span><span style={{color:"#8ca0b8",fontSize:"12px"}}>Q{i+1}/{QUESTOES_PADRAO.length}</span></div>
          <p style={{color:"#c8d8e8",lineHeight:1.7,marginBottom:"10px"}}>{q.enunciado}</p>
          {q.opcoes&&q.opcoes.map((o,j)=>(<p key={j} style={{color:o.startsWith(q.gabarito)?"#00c97f":"#8ca0b8",fontSize:"13px",marginBottom:"4px",paddingLeft:"8px"}}>{o.startsWith(q.gabarito)?"✅ ":"   "}{o}</p>))}
          {q.gabarito&&!q.opcoes&&(<div style={{background:"#0a2a1a",borderRadius:"6px",padding:"10px",border:"1px solid #00c97f",marginTop:"8px"}}><p style={{color:"#00c97f",fontSize:"13px",margin:0}}>✅ {q.gabarito}</p></div>)}
        </Card>))}
      </div>);
    }

    function TelaSuperResumo(){
      return(<div><h2 style={{color:"#1a8cff",marginBottom:"16px"}}>⚡ Super Resumo</h2><div style={{background:"#0a1a2a",borderRadius:"10px",padding:"20px",border:"1px solid #2a3f5c"}}><pre style={{color:"#c8d8e8",fontSize:"13px",whiteSpace:"pre-wrap",lineHeight:1.8,margin:0}}>{SUPER_RESUMO}</pre></div></div>);
    }

    function TelaResumo(){
      const [aba,setAba]=useState(0);
      return(<div>
        <h2 style={{color:"#b44fff",marginBottom:"12px"}}>📚 Resumo Completo</h2>
        <div style={{display:"flex",flexWrap:"wrap",gap:"6px",marginBottom:"14px"}}>{RESUMO_BLOCOS.map((b,i)=>(<button key={i} onClick={()=>setAba(i)} style={{padding:"6px 12px",background:aba===i?"#b44fff":"#1e2a3a",color:aba===i?"#fff":"#8ca0b8",border:`1px solid ${aba===i?"#b44fff":"#2d3e52"}`,borderRadius:"6px",cursor:"pointer",fontSize:"12px"}}>B{i+1}</button>))}</div>
        <Card><p style={{color:"#b44fff",fontWeight:"bold",marginBottom:"12px"}}>{RESUMO_BLOCOS[aba].titulo}</p><pre style={{color:"#c8d8e8",fontSize:"13px",whiteSpace:"pre-wrap",lineHeight:1.8,margin:0}}>{RESUMO_BLOCOS[aba].conteudo}</pre></Card>
      </div>);
    }

    function TelaInicio({setScreen}){
      const tipos=[{icon:"🎯",label:"Múltipla Escolha",screen:"mc",cor:"#1a8cff"},{icon:"✅",label:"Certo ou Errado",screen:"ce",cor:"#00c97f"},{icon:"✏️",label:"Complete Lacunas",screen:"cl",cor:"#ffaa00"},{icon:"📖",label:"Definições",screen:"def",cor:"#b44fff"},{icon:"🔗",label:"Correlacione",screen:"cor",cor:"#ff7f50"},{icon:"🗣️",label:"Cite",screen:"cite",cor:"#00c97f"},{icon:"📋",label:"Liste",screen:"liste",cor:"#b44fff"},{icon:"🔵",label:"V ou F",screen:"vf",cor:"#1a8cff"},{icon:"🃏",label:"Flashcards",screen:"fc",cor:"#ffaa00"},{icon:"🗺️",label:"Mapa Mental",screen:"mm",cor:"#1a8cff"},{icon:"📄",label:"Questões Padrão",screen:"qp",cor:"#ff7f50"},{icon:"🔍",label:"Consulta",screen:"cons",cor:"#00c97f"},{icon:"⚡",label:"Super Resumo",screen:"sr",cor:"#1a8cff"},{icon:"📚",label:"Resumo Completo",screen:"res",cor:"#b44fff"}];
      return(<div>
        <div style={{textAlign:"center",marginBottom:"24px",padding:"24px",background:"linear-gradient(135deg,#0a1a3a,#1a3a6a)",borderRadius:"12px",border:"1px solid #2a3f5c"}}>
          <div style={{fontSize:"48px",marginBottom:"8px"}}>⚓</div>
          <h1 style={{color:"#1a8cff",margin:"0 0 6px",fontSize:"22px"}}>GptOpFuzNav</h1>
          <p style={{color:"#8ca0b8",margin:0,fontSize:"13px"}}>Grupo de Operações de Fuzileiros Navais</p>
          <p style={{color:"#c8d8e8",margin:"8px 0 0",fontSize:"12px"}}>{MC_QS.length} MC • {CE_QS.length} C/E • {CL_QS.length} Lacunas • {DEF_QS.length} Def • {COR_SETS.length} Cor • {CITE_QS.length} Cite • {LISTE_QS.length} Liste • {VF_QS.length} VF • {FLASHCARDS.length} FC</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:"10px"}}>
          {tipos.map((t,i)=>(<div key={i} onClick={()=>setScreen(t.screen)} style={{background:"#14203a",border:`2px solid ${t.cor}33`,borderRadius:"10px",padding:"14px",cursor:"pointer",textAlign:"center"}}><div style={{fontSize:"24px",marginBottom:"6px"}}>{t.icon}</div><p style={{color:t.cor,fontSize:"12px",fontWeight:"bold",margin:0}}>{t.label}</p></div>))}
        </div>
      </div>);
    }

    /* ═══ APP PRINCIPAL ═══ */
    function App(){
      const [screen,setScreen]=useState("home");
      const [tick,setTick]=useState(0);
      function refresh(){setTick(t=>t+1);}
      const abas=[{id:"home",label:"🏠 Início"},{id:"sr",label:"⚡ Super"},{id:"res",label:"📚 Resumo"},{id:"mm",label:"🗺️ Mapa"},{id:"fc",label:"🃏 Flash"},{id:"cons",label:"🔍 Busca"},{id:"qp",label:"📄 Padrão"}];
      const exercicios=[{id:"mc",label:"🎯 MC"},{id:"ce",label:"✅ C/E"},{id:"cl",label:"✏️ Lac"},{id:"def",label:"📖 Def"},{id:"cor",label:"🔗 Cor"},{id:"cite",label:"🗣️ Cite"},{id:"liste",label:"📋 Liste"},{id:"vf",label:"🔵 V/F"}];
      return(
        <div style={{minHeight:"100vh",background:"#0a1220",fontFamily:"'Segoe UI',Arial,sans-serif",color:"#c8d8e8"}}>
          <div style={{background:"#0d1b2e",borderBottom:"1px solid #1a2a3e",padding:"8px 10px",position:"sticky",top:0,zIndex:100}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:"4px",maxWidth:"900px",margin:"0 auto"}}>
              {abas.map(a=><BtnNav key={a.id} label={a.label} ativo={screen===a.id} onClick={()=>setScreen(a.id)}/>)}
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:"4px",maxWidth:"900px",margin:"4px auto 0",borderTop:"1px solid #1a2a3e",paddingTop:"4px"}}>
              <span style={{color:"#8ca0b8",fontSize:"11px",padding:"4px 6px",alignSelf:"center"}}>Exercícios:</span>
              {exercicios.map(a=><BtnNav key={a.id} label={a.label} ativo={screen===a.id} onClick={()=>setScreen(a.id)}/>)}
            </div>
          </div>
          <div style={{maxWidth:"900px",margin:"0 auto",padding:"16px 12px 40px"}}>
            {screen==="home"&&<TelaInicio setScreen={setScreen}/>}
            {screen==="sr"&&<TelaSuperResumo/>}
            {screen==="res"&&<TelaResumo/>}
            {screen==="mm"&&<TelaMapaMental/>}
            {screen==="fc"&&<TelaFlashcards refresh={refresh}/>}
            {screen==="cons"&&<TelaConsulta/>}
            {screen==="qp"&&<TelaQuestoesPadrao/>}
            {screen==="mc"&&<TelaMultiplaEscolha refresh={refresh}/>}
            {screen==="ce"&&<TelaCertoErrado refresh={refresh}/>}
            {screen==="cl"&&<TelaCompleteLacunas refresh={refresh}/>}
            {screen==="def"&&<TelaDefinicoes refresh={refresh}/>}
            {screen==="cor"&&<TelaCorrelacione refresh={refresh}/>}
            {screen==="cite"&&<TelaCite refresh={refresh}/>}
            {screen==="liste"&&<TelaListe refresh={refresh}/>}
            {screen==="vf"&&<TelaVF refresh={refresh}/>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>

  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('/GptOpFuzNav-FuzNav2026/sw.js').catch(()=>{});
      });
    }
  </script>
</body>
